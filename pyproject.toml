[project]
name = "generative-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xia Chu", email = "ronchuxia@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "wandb>=0.31.0",
]

[project.scripts]
generative-models = "generative_models:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
